packages:
  - "apps/*"
  - "packages/*"

overrides:
  '@babel/core': ^7.29.6
  '@humanfs/node': '>=0.16.8'
  '@tootallnate/once@<3.0.1': '>=3.0.1'
  '@ungap/structured-clone@<1.3.1': '>=1.3.1'
  '@xmldom/xmldom': '>=0.9.12'
  brace-expansion: '>=5.0.12'
  browserslist: '>=4.28.7'
  compression: '>=1.8.2'
  form-data: '>=4.0.6'
  'glob@>=9.0.0 <14.0.2': '>=14.0.2'
  handlebars: '>=4.7.10'
  js-yaml: '>=4.3.2'
  'lodash@>=4.0.0 <=4.17.23': '>=4.18.0'
  'minimatch@>=9.0.0 <11.0.1': '>=11.0.1'
  # metro < 0.83.8 depends on image-size 1.2.1 (GHSA-5p2g-fcmc-qvqq and
  # GHSA-w3rx-r6r6-pgpr, both High). metro 0.83.8 removed the image-size
  # dependency. @expo/metro 54.2.0 pins 0.83.3 exactly, so we pin the whole
  # metro family to 0.83.8 to keep the packages in lockstep. Overriding
  # image-size to 2.x directly would break Metro, which calls
  # require('image-size')(path), a call shape image-size 2.x no longer supports.
  # Drop these entries once Expo ships @expo/metro >= 55.1.2 (pins 0.83.8+).
  'metro@>=0.83.0 <0.83.8': 0.83.8
  'metro-babel-transformer@>=0.83.0 <0.83.8': 0.83.8
  'metro-cache@>=0.83.0 <0.83.8': 0.83.8
  'metro-cache-key@>=0.83.0 <0.83.8': 0.83.8
  'metro-config@>=0.83.0 <0.83.8': 0.83.8
  'metro-core@>=0.83.0 <0.83.8': 0.83.8
  'metro-file-map@>=0.83.0 <0.83.8': 0.83.8
  'metro-minify-terser@>=0.83.0 <0.83.8': 0.83.8
  'metro-resolver@>=0.83.0 <0.83.8': 0.83.8
  'metro-runtime@>=0.83.0 <0.83.8': 0.83.8
  'metro-source-map@>=0.83.0 <0.83.8': 0.83.8
  'metro-symbolicate@>=0.83.0 <0.83.8': 0.83.8
  'metro-transform-plugins@>=0.83.0 <0.83.8': 0.83.8
  'metro-transform-worker@>=0.83.0 <0.83.8': 0.83.8
  nanoid: '>=3.3.17 <4'
  node-forge: '>=1.4.1'
  postcss: '>=8.5.18'
  postcss-selector-parser: '>=7.1.6'
  shell-quote: '>=1.11.0'
  source-map-js: '>=1.2.2'
  tmp: '>=0.2.6'
  uuid: '>=11.1.1'
  ws: '>=8.21.0'
  # zod < 4.6.6: GHSA-mrhx-c7xc-m3w5 (High). The only consumer is @expo/cli
  # (zod ^3.25.76), and there is no v3 backport. @expo/cli only uses zod in its
  # dev-tools plugin schemas (z.object/string/enum/array/union/literal, .min,
  # .url, .readonly, .describe, safeParse, error.issues, error.message), and
  # all of these exist in zod 4. Drop once @expo/cli migrates to zod 4.
  'zod@<4.6.6': ^4.6.6

# deepmerge 4.2.0-4.3.1 has a low-severity prototype-poisoning advisory
# (GHSA-gcqx-w48m-w2h4). No patched version is on npm (4.3.1 is the latest),
# so neither an upgrade nor an override can fix it. It reaches us through
# @expo/config (SDK 55) and jest-config 29, which merge developer-controlled
# app and jest config at build/test time, not runtime input.
# Suppressed until deepmerge 4.3.2+ is published or Expo/Jest drop it
# (@expo/config 58 already has).
# Re-evaluate when: `npm view deepmerge version` shows >= 4.3.2
audit:
  ignore:
    - GHSA-gcqx-w48m-w2h4
