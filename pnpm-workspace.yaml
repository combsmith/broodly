packages:
  - "apps/*"
  - "packages/*"

overrides:
  '@babel/core': ^7.29.6
  '@humanfs/node': '>=0.16.8'
  '@tootallnate/once@<3.0.1': '>=3.0.1'
  '@ungap/structured-clone@<1.3.1': '>=1.3.1'
  '@xmldom/xmldom': '>=0.9.12'
  brace-expansion: '>=5.0.12'
  browserslist: '>=4.28.7'
  compression: '>=1.8.2'
  form-data: '>=4.0.6'
  handlebars: '>=4.7.10'
  js-yaml: '>=4.3.2'
  'lodash@>=4.0.0 <=4.17.23': '>=4.18.0'
  nanoid: '>=3.3.17 <4'
  postcss: '>=8.5.18'
  postcss-selector-parser: '>=7.1.6'
  shell-quote: '>=1.11.0'
  source-map-js: '>=1.2.2'
  tmp: '>=0.2.6'
  uuid: '>=11.1.1'
  ws: '>=8.21.0'

# image-size <= 2.0.2 has two high-severity DoS advisories (ICNS and JXL/HEIF
# parsers). The patched version (>= 2.0.3) has not been published to npm yet.
# Metro (React Native bundler) pins image-size@1.2.1 which falls in the
# affected range. These are suppressed until image-size 2.0.3+ is available.
# Re-evaluate when: https://github.com/image-size/image-size/releases shows >= 2.0.3
#
# node-forge <= 1.4.0 has a high-severity RSA signature verification vulnerability.
# The fix (>= 1.4.1) has not been published to npm yet. Expo depends on node-forge
# for code signing. This is suppressed until node-forge 1.4.1+ is released.
# Re-evaluate when: https://github.com/digitalbazaar/forge/releases shows >= 1.4.1
#
# braces <= 3.0.3 has a high-severity DoS vulnerability through deeply nested patterns.
# The fix (>= 3.0.4) has not been published to npm yet. This is a transitive dependency
# through @expo/html-elements > react-native > metro > micromatch > braces.
# Suppressed until braces 3.0.4+ is released.
# Re-evaluate when: https://github.com/micromatch/braces/releases shows >= 3.0.4
audit:
  ignore:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-86w9-cpqp-85rv
    - GHSA-vfj7-8cjw-p6xm
