# CodeRabbit configuration
# https://docs.coderabbit.ai/guides/configure-coderabbit
language: en-US
reviews:
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_filters:
    - "!_bmad/**"
    - "!_bmad-output/**"
    - "!.claude/**"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
chat:
  auto_reply: true
