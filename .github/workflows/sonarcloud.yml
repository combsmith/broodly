name: SonarCloud Analysis

permissions: {}

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate JS/TS coverage report
        working-directory: apps/mobile
        run: pnpm exec jest --coverage --coverageReporters=lcov --coverageDirectory=coverage
      - name: SonarCloud Scan (attempt 1)
        id: sonar_1
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        continue-on-error: true
      - name: Backoff before retry (attempt 2)
        if: ${{ env.SONAR_TOKEN != '' && steps.sonar_1.outcome == 'failure' }}
        run: sleep 10
      - name: SonarCloud Scan (attempt 2)
        id: sonar_2
        if: ${{ env.SONAR_TOKEN != '' && steps.sonar_1.outcome == 'failure' }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        continue-on-error: true
      - name: Backoff before retry (attempt 3)
        if: ${{ env.SONAR_TOKEN != '' && steps.sonar_2.outcome == 'failure' }}
        run: sleep 20
      - name: SonarCloud Scan (attempt 3)
        if: ${{ env.SONAR_TOKEN != '' && steps.sonar_2.outcome == 'failure' }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
