# Repository settings managed via probot/settings
# https://github.com/apps/settings
#
# This file brings the repository into compliance with the
# combsmith organization standards:
# https://github.com/combsmith/.github/blob/main/standards/github-settings.md
#
# Rulesets (managed via GitHub API, not probot/settings):
#   - pr-quality      (id: 14592511) — squash-only, 1 required review, code-owner
#                                       review, last-push approval, thread resolution
#   - code-quality    (id: 15055268) — required checks: SonarCloud, CodeQL,
#                                       claude-code / claude, TypeScript, Go

repository:
  has_wiki: false
  has_discussions: true
  delete_branch_on_merge: true
  allow_squash_merge: true
  allow_merge_commit: true
  allow_rebase_merge: true
  allow_auto_merge: true
  squash_merge_commit_title: PR_TITLE
  squash_merge_commit_message: COMMIT_MESSAGES
  security_and_analysis:
    dependabot_security_updates:
      status: enabled
    secret_scanning:
      status: enabled
    secret_scanning_push_protection:
      status: enabled
    secret_scanning_ai_detection:
      status: enabled
    secret_scanning_non_provider_patterns:
      status: enabled

labels:
  - name: security
    color: "e4e669"
    description: Security-related issues and improvements
  - name: stale
    color: "ededed"
    description: No recent activity — will be closed if no action taken
  - name: pinned
    color: "0075ca"
    description: Exempt from automated stale closure
  - name: keep-open
    color: "0075ca"
    description: Exempt from automated stale closure
