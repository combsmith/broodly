version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels:
      - "security"
      - "dependencies"
    ignore:
      # These transitive dependencies are constrained to safe versions by the
      # `overrides:` block in pnpm-workspace.yaml, which forces the lockfile to
      # resolve patched versions. Dependabot's security updater does not
      # understand pnpm overrides, so it generates failing update attempts
      # (security_update_not_possible / all_versions_ignored) for these deps.
      #
      # This list MUST mirror the override package names in pnpm-workspace.yaml.
      # The sync is enforced by apps/mobile/__tests__/dependabot-overrides-sync.test.ts.
      - dependency-name: "@babel/core"
      - dependency-name: "@humanfs/node"
      - dependency-name: "@tootallnate/once"
      - dependency-name: "@ungap/structured-clone"
      - dependency-name: "@xmldom/xmldom"
      - dependency-name: "brace-expansion"
      - dependency-name: "browserslist"
      - dependency-name: "compression"
      - dependency-name: "form-data"
      # Dependabot evaluates `versions` against candidate *target* releases, not
      # the currently installed version. The glob/minimatch overrides force
      # ranges up to the override target, so ignore candidates at or above that
      # target (the update attempt that conflicts with the override). Lower
      # candidates (e.g. updates for glob@7.2.3 and minimatch@3.1.5 via
      # test-exclude) stay eligible.
      - dependency-name: "glob"
        versions:
          - ">= 14.0.2"
      - dependency-name: "handlebars"
      - dependency-name: "js-yaml"
      - dependency-name: "lodash"
      # metro family and zod: ignore only the vulnerable ranges (< 0.83.8 for
      # metro*, < 4.6.6 for zod) that the pnpm overrides replace. Unlike the
      # glob/minimatch entries above, these ranges block the vulnerable
      # releases themselves, so newer patched releases stay eligible for
      # security updates. The overrides-sync test checks package names only,
      # not these version ranges.
      - dependency-name: "metro"
        versions:
          - ">= 0.83.0, < 0.83.8"
      - dependency-name: "metro-babel-transformer"
        versions:
          - ">= 0.83.0, < 0.83.8"
      - dependency-name: "metro-cache"
        versions:
          - ">= 0.83.0, < 0.83.8"
      - dependency-name: "metro-cache-key"
        versions:
          - ">= 0.83.0, < 0.83.8"
      - dependency-name: "metro-config"
        versions:
          - ">= 0.83.0, < 0.83.8"
      - dependency-name: "metro-core"
        versions:
          - ">= 0.83.0, < 0.83.8"
      - dependency-name: "metro-file-map"
        versions:
          - ">= 0.83.0, < 0.83.8"
      - dependency-name: "metro-minify-terser"
        versions:
          - ">= 0.83.0, < 0.83.8"
      - dependency-name: "metro-resolver"
        versions:
          - ">= 0.83.0, < 0.83.8"
      - dependency-name: "metro-runtime"
        versions:
          - ">= 0.83.0, < 0.83.8"
      - dependency-name: "metro-source-map"
        versions:
          - ">= 0.83.0, < 0.83.8"
      - dependency-name: "metro-symbolicate"
        versions:
          - ">= 0.83.0, < 0.83.8"
      - dependency-name: "metro-transform-plugins"
        versions:
          - ">= 0.83.0, < 0.83.8"
      - dependency-name: "metro-transform-worker"
        versions:
          - ">= 0.83.0, < 0.83.8"
      - dependency-name: "minimatch"
        versions:
          - ">= 11.0.1"
      - dependency-name: "nanoid"
      - dependency-name: "node-forge"
      - dependency-name: "postcss"
      - dependency-name: "postcss-selector-parser"
      - dependency-name: "shell-quote"
      - dependency-name: "source-map-js"
      - dependency-name: "tmp"
      - dependency-name: "uuid"
      - dependency-name: "ws"
      - dependency-name: "zod"
        versions:
          - "< 4.6.6"

  - package-ecosystem: "gomod"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels:
      - "security"
      - "dependencies"

  - package-ecosystem: "terraform"
    directory: "/infra/terraform"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels:
      - "security"
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "security"
      - "dependencies"
